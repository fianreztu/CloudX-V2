name: Build Moviebox and publish moviebox.cs3

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Moviebox (assembleDebug)
        run: ./gradlew :Moviebox:assembleDebug --no-daemon --stacktrace

      - name: Locate built APK
        id: find_apk
        run: |
          set -e
          APK_PATH=$(find Moviebox/build/outputs/apk -type f -name "*Moviebox*debug*.apk" | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create moviebox.cs3 artifact (copy APK)
        run: |
          mkdir -p Moviebox
          cp "${{ steps.find_apk.outputs.apk_path }}" Moviebox/Moviebox.cs3
          ls -lh Moviebox/Moviebox.cs3

      - name: Commit moviebox.cs3 to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Moviebox/Moviebox.cs3
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "[ci] Update Moviebox.cs3 (built artifact)"
          git push origin HEAD:main
